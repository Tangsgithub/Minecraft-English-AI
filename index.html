<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var nativeFetch = window.fetch;
          var currentFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch || nativeFetch; },
            set: function(fn) { currentFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch descriptor patch:', e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Minecraft English AI</title>
    <meta name="description" content="基于 Minecraft 世界观与新概念英语体系的儿童英语 AI 互动学习与口语练习客户端。" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
